services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: college-quiz-backend:local
    restart: unless-stopped
    environment:
      USE_SQLITE: "1"
      PORT: "5000"
      APP_ENV: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-docker-change-this-secret}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./docker-data/college.db:/app/backend/college.db
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/auth/super-admin-status', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: college-quiz-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3

