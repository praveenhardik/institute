name: Build, Test, and Verify AWS + Vercel Integration

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-and-verify:
    name: Build, Test & Verify Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend production bundle
        run: npm run build --prefix frontend

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend unit tests
        env:
          USE_SQLITE: "1"
        run: python -m unittest backend/test_app.py

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          role-to-assume: arn:aws:iam::523220341693:role/GitHubActionsRole
          aws-region: ap-south-1
          allowed-account-ids: 523220341693
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Verify AWS STS Identity
        continue-on-error: true
        run: aws sts get-caller-identity

      - name: Trigger AWS EC2 Deployment via Systems Manager or SSH
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.EC2_INSTANCE_ID }}" ]; then
            echo "Deploying latest commit to EC2 instance ${{ secrets.EC2_INSTANCE_ID }} via AWS SSM..."
            aws ssm send-command \
              --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["cd /app || cd /opt/institute || cd /home/ubuntu/institute", "git pull origin main", "docker compose -f docker-compose.aws.yml up -d --build backend || true"]' \
              --region ap-south-1
          elif [ -n "${{ secrets.EC2_SSH_KEY }}" ] && [ -n "${{ secrets.EC2_HOST }}" ]; then
            echo "Deploying via SSH to ${{ secrets.EC2_HOST }}..."
            mkdir -p ~/.ssh
            echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} "cd /app || cd /opt/institute || cd /home/ubuntu/institute && git pull origin main && docker compose -f docker-compose.aws.yml up -d --build backend || true"
          else
            echo "Notice: EC2_INSTANCE_ID / SSH credentials not configured in GitHub Secrets. AWS Backend runs on EC2 3.27.170.60."
          fi

      - name: Deploy Frontend to Vercel
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Deploying production bundle to Vercel via CLI..."
            npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          else
            echo "Notice: VERCEL_TOKEN secret not set in GitHub repository settings. If your GitHub repository is connected to Vercel via Git integration, Vercel automatically deploys every push to main."
          fi

      - name: Verify AWS EC2 Backend Health
        run: |
          echo "Checking AWS EC2 Backend API at http://3.27.170.60:5000/api/college-name..."
          curl -fsS --max-time 15 http://3.27.170.60:5000/api/college-name

      - name: Verify Vercel Production Frontend Health
        run: |
          echo "Checking Vercel Frontend Deployment at https://institute-dun.vercel.app/api/college-name..."
          curl -fsS --max-time 15 https://institute-dun.vercel.app/api/college-name
