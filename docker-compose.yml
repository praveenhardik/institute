services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: college_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-college_live}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PGPORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-college_live}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - college_net

  # -------------------------------------------------------------
  # 2. Python Flask Backend Service
  # -------------------------------------------------------------
  backend:
    container_name: college_backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-college_live}
      PORT: 5000
      FLASK_ENV: production
      PYTHONUNBUFFERED: "1"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/auth/super-admin-status"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - college_net

  # -------------------------------------------------------------
  # 3. React Vite + Nginx Frontend Service
  # -------------------------------------------------------------
  frontend:
    container_name: college_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - college_net

volumes:
  pgdata:

networks:
  college_net:
    driver: bridge
