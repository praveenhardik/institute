services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the AWS Systems Manager parameter}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the AWS Systems Manager parameter}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      APP_ENV: production
      PORT: 5000
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/auth/super-admin-status"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [college_net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks: [college_net]

networks:
  college_net:
    driver: bridge
